<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">评测是一条完整的可复现管线</title><desc id="desc">同一权重在不同输入预算、答案提取器与评测版本下，可能产生不同分数。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="290" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#0f172a">评测是一条完整的可复现管线</text><rect x="36" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="108" font-size="19" font-weight="700" fill="#1d4ed8">1. 冻结输入</text><text x="52" y="142" font-size="16" fill="#334155">数据版本、划分、哈希</text><text x="52" y="169" font-size="16" fill="#334155">媒体、问题、参考答案</text><path d="M276 139H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="108" font-size="19" font-weight="700" fill="#1d4ed8">2. 固定观察预算</text><text x="322" y="142" font-size="16" fill="#334155">分辨率、切块、帧数</text><text x="322" y="169" font-size="16" fill="#334155">字幕、音频、工具权限</text><path d="M546 139H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="108" font-size="19" font-weight="700" fill="#1d4ed8">3. 生成与提取</text><text x="592" y="142" font-size="16" fill="#334155">提示、采样、输出上限</text><text x="592" y="169" font-size="16" fill="#334155">原始回答 + 结构化答案</text><path d="M816 139H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="108" font-size="19" font-weight="700" fill="#1d4ed8">4. 评分与诊断</text><text x="862" y="142" font-size="16" fill="#334155">官方指标、失败记录</text><text x="862" y="169" font-size="16" fill="#334155">分组区间 + 能力切片</text><text x="36" y="268" font-size="15" fill="#475569">同一权重在不同输入预算、答案提取器与评测版本下，可能产生不同分数。</text></g></svg>