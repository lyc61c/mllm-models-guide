<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">从错误分析回到数据实验</title><desc id="desc">新数据是否有效，要通过同预算的受控实验验证；测试集不能反复用来挑方案。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="290" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#0f172a">从错误分析回到数据实验</text><rect x="36" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="108" font-size="19" font-weight="700" fill="#1d4ed8">1. 失败切片</text><text x="52" y="142" font-size="16" fill="#334155">小字 / 数量 / 长时视频</text><text x="52" y="169" font-size="16" fill="#334155">视觉、语言、推理拆分</text><path d="M276 139H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="108" font-size="19" font-weight="700" fill="#1d4ed8">2. 提出可检验假设</text><text x="322" y="142" font-size="16" fill="#334155">裁剪丢失证据？</text><text x="322" y="169" font-size="16" fill="#334155">标签错？时序未覆盖？</text><path d="M546 139H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="108" font-size="19" font-weight="700" fill="#1d4ed8">3. 只改变目标变量</text><text x="592" y="142" font-size="16" fill="#334155">新数据或处理策略</text><text x="592" y="169" font-size="16" fill="#334155">固定模型与训练预算</text><path d="M816 139H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="108" font-size="19" font-weight="700" fill="#1d4ed8">4. 验证并保留记录</text><text x="862" y="142" font-size="16" fill="#334155">开发集筛选、冻结测试</text><text x="862" y="169" font-size="16" fill="#334155">增益、成本、其他能力</text><text x="36" y="268" font-size="15" fill="#475569">新数据是否有效，要通过同预算的受控实验验证；测试集不能反复用来挑方案。</text></g></svg>