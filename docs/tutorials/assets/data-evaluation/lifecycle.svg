<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">多模态数据生命周期</title><desc id="desc">先冻结评测集，再迭代训练数据；所有加工都保留可追溯记录。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="460" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#0f172a">多模态数据生命周期</text><rect x="36" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="108" font-size="19" font-weight="700" fill="#1d4ed8">1. 明确目标</text><text x="52" y="142" font-size="16" fill="#334155">任务 × 模态 × 场景</text><text x="52" y="169" font-size="16" fill="#334155">定义可接受的证据</text><path d="M276 139H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="108" font-size="19" font-weight="700" fill="#1d4ed8">2. 获取与登记</text><text x="322" y="142" font-size="16" fill="#334155">媒体 / 文本 / 标注</text><text x="322" y="169" font-size="16" fill="#334155">来源、许可、父对象</text><path d="M546 139H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="108" font-size="19" font-weight="700" fill="#1d4ed8">3. 解码与对齐</text><text x="592" y="142" font-size="16" fill="#334155">尺寸、坐标、时间轴</text><text x="592" y="169" font-size="16" fill="#334155">保留变换与采样记录</text><path d="M816 139H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="108" font-size="19" font-weight="700" fill="#1d4ed8">4. 筛选与去重</text><text x="862" y="142" font-size="16" fill="#334155">质量、人审、近重复</text><text x="862" y="169" font-size="16" fill="#334155">基准媒体与派生样本</text><rect x="36" y="242" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="242" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="278" font-size="19" font-weight="700" fill="#1d4ed8">5. 整组划分</text><text x="52" y="312" font-size="16" fill="#334155">父文档 / 视频 / 连通组</text><text x="52" y="339" font-size="16" fill="#334155">train · dev · test</text><path d="M276 309H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="242" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="242" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="278" font-size="19" font-weight="700" fill="#1d4ed8">6. 混合与训练</text><text x="322" y="312" font-size="16" fill="#334155">有效 token / 计算预算</text><text x="322" y="339" font-size="16" fill="#334155">损失掩码、版本指纹</text><path d="M546 309H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="242" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="242" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="278" font-size="19" font-weight="700" fill="#1d4ed8">7. 冻结评测</text><text x="592" y="312" font-size="16" fill="#334155">协议、逐例预测、指标</text><text x="592" y="339" font-size="16" fill="#334155">置信区间与切片</text><path d="M816 309H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="242" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="242" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="278" font-size="19" font-weight="700" fill="#1d4ed8">8. 误差回流</text><text x="862" y="312" font-size="16" fill="#334155">定位失败原因</text><text x="862" y="339" font-size="16" fill="#334155">改数据 → 受控消融</text><text x="36" y="438" font-size="15" fill="#475569">先冻结评测集，再迭代训练数据；所有加工都保留可追溯记录。</text></g></svg>