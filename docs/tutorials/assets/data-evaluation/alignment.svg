<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">媒体加工必须保留对应关系</title><desc id="desc">文本能读通不代表监督正确；坐标与时间轴必须落到模型实际看见的输入。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="290" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#0f172a">媒体加工必须保留对应关系</text><rect x="36" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="108" font-size="19" font-weight="700" fill="#1d4ed8">1. 原始媒体</text><text x="52" y="142" font-size="16" fill="#334155">原图 W×H / 原视频</text><text x="52" y="169" font-size="16" fill="#334155">原音频与时间基准</text><path d="M276 139H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="108" font-size="19" font-weight="700" fill="#1d4ed8">2. 显式变换</text><text x="322" y="142" font-size="16" fill="#334155">旋转 → 缩放 → 裁剪</text><text x="322" y="169" font-size="16" fill="#334155">抽帧 → 重采样</text><path d="M546 139H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="108" font-size="19" font-weight="700" fill="#1d4ed8">3. 同步监督</text><text x="592" y="142" font-size="16" fill="#334155">框坐标随图像变化</text><text x="592" y="169" font-size="16" fill="#334155">事件时间与音轨对齐</text><path d="M816 139H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="108" font-size="19" font-weight="700" fill="#1d4ed8">4. 审计记录</text><text x="862" y="142" font-size="16" fill="#334155">变换矩阵 / 原始时间戳</text><text x="862" y="169" font-size="16" fill="#334155">采样策略 / 有效覆盖</text><text x="36" y="268" font-size="15" fill="#475569">文本能读通不代表监督正确；坐标与时间轴必须落到模型实际看见的输入。</text></g></svg>