<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">泄漏控制：先连接，再划分</title><desc id="desc">只按问答行随机切分，无法阻止同一图像、同一视频或镜像文档跨集合。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs><rect width="1120" height="290" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="36" y="44" font-size="24" font-weight="700" fill="#0f172a">泄漏控制：先连接，再划分</text><rect x="36" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="36" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="52" y="108" font-size="19" font-weight="700" fill="#1d4ed8">1. 父文档 A</text><text x="52" y="142" font-size="16" fill="#334155">页面 A1 → 问题 Q1</text><text x="52" y="169" font-size="16" fill="#334155">页面 A2 → 问题 Q2</text><path d="M276 139H299" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="306" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="322" y="108" font-size="19" font-weight="700" fill="#1d4ed8">2. 镜像文档 B</text><text x="322" y="142" font-size="16" fill="#334155">B1 与 A2 媒体相同</text><text x="322" y="169" font-size="16" fill="#334155">B2 是另一页面</text><path d="M546 139H569" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="576" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="592" y="108" font-size="19" font-weight="700" fill="#1d4ed8">3. 建立连接</text><text x="592" y="142" font-size="16" fill="#334155">同父对象边 + 重复边</text><text x="592" y="169" font-size="16" fill="#334155">A 和 B 属于同一连通组</text><path d="M816 139H839" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="846" y="72" width="238" height="132" rx="10" fill="white" stroke="#cbd5e1"/><rect x="846" y="72" width="238" height="5" rx="2" fill="#2563eb"/><text x="862" y="108" font-size="19" font-weight="700" fill="#1d4ed8">4. 整体处理</text><text x="862" y="142" font-size="16" fill="#334155">整组进入一个划分</text><text x="862" y="169" font-size="16" fill="#334155">命中保护集则整组清除</text><text x="36" y="268" font-size="15" fill="#475569">只按问答行随机切分，无法阻止同一图像、同一视频或镜像文档跨集合。</text></g></svg>